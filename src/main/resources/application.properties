spring.application.name = ${APP_NAME:Expense Tracker}

spring.datasource.url = jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_tracker}
spring.datasource.username = ${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password = ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.hibernate.ddl-auto = validate
spring.jpa.show-sql = false

spring.flyway.enabled = true
spring.flyway.locations = classpath:db/migration
spring.flyway.validate-on-migrate = true

springdocs.swagger-ui.enabled = true
springdoc.api-docs.enabled = true
springdoc.api-docs.path = /api-docs
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.operationsSorter = method

jwt.secret = ${JWT_SECRET:bXktZXhwZW5zZS10cmFja2VyLWRldi1rZXktMzItYnl0ZXM=}
jwt.expiration = ${JWT_EXPIRATION:3600000}
